name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Validate drill bank
        run: python -m drills.engine validate
      - name: Run keyless eval gate
        run: python -m lab.evals run
      - name: Check Markdown links
        run: python tools/check_links.py
      - name: Check blueprint consistency
        run: python tools/check_blueprint_consistency.py
