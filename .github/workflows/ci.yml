name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Validate drill bank
        run: python -m drills.engine validate
      - name: Run keyless eval gate
        run: python -m lab.evals run
      - name: Check Markdown links
        run: python tools/check_links.py
      - name: Check blueprint consistency
        run: python tools/check_blueprint_consistency.py

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Type check
        working-directory: site
        run: npm run typecheck
      - name: Lint site code
        working-directory: site
        run: npm run lint
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Run unit tests
        working-directory: site
        run: npm run test:unit
      - name: Run end-to-end and accessibility tests
        working-directory: site
        run: npm run test:e2e
      - name: Check single source against built output
        run: python tools/check_content_single_source.py
      - name: Check links against built output
        run: python tools/check_links.py
      - name: Upload built site artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 7
      - name: Upload test report and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7
