    url: https://code.claude.com/docs/en/memory
    verified_on: "2026-09-09"
  - title: Control execution with hooks — Anthropic (Claude Code docs)
    url: https://code.claude.com/docs/en/agent-sdk/hooks
    verified_on: "2026-09-09"
