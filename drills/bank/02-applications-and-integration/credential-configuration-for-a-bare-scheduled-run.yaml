id: credential-configuration-for-a-bare-scheduled-run
domain: Applications and Integration
sub_skill: Configuration Management
difficulty: application
select: 1
stem: >-
  A scheduled job runs Claude Code non-interactively in bare mode so that its behavior does not
  depend on whatever is configured on the host. It worked while a developer tested it from their own
  terminal and fails on the scheduler with an authentication failure, although that machine has a
  working interactive login. How should the job be configured?
options:
  - id: a
    text: >-
      Drop bare mode so the run picks up the machine's existing login, since the credential is
      already present and valid.
    correct: false
    rationale: >-
      This trades the property the job was built for — identical behavior on any machine — to avoid
      configuring a credential. It also lets the host's hooks, plugins, and instruction files back
      into a scheduled run.
    trap_type: wrong-layer
  - id: b
    text: >-
      Keep bare mode and pass the credential through the settings the command line supplies, using
      the same file the repository commits for its other settings.
    correct: false
    rationale: >-
      Supplying settings on the command line is the right channel, but pointing it at the committed
      settings file puts the credential in source control. The helper exists so the value is
      resolved at run time from somewhere the repository does not hold.
    trap_type: right-idea-wrong-mechanism
  - id: c
    text: >-
      Run the scheduled job as the developer's own user account, so the keychain entry is available
      to it.
    correct: false
    rationale: >-
      Bare mode does not read the keychain regardless of which account runs it, so this changes
      nothing while coupling a production job to one person's machine identity.
    trap_type: false-capability
  - id: d
    text: >-
      Supply an API key through the environment, or an API-key helper in the settings passed on the
      command line, because bare mode reads no stored login credential.
    correct: true
    rationale: >-
      Bare mode never reads OAuth credentials or the system keychain, which is what makes it
      reproducible and is also why an interactive login on the host does nothing for it. The
      documented options are an environment variable holding a key, or a helper supplied through the
      settings the command line passes.
  - id: e
    text: >-
      Add the credential to the repository's shared project settings so every run has it, wherever it
      executes.
    correct: false
    rationale: >-
      A committed secret is a leaked secret, and the shared tier is the one file guaranteed to reach
      everyone. Credentials belong in the environment or behind a helper, never in tracked
      configuration.
    trap_type: wrong-layer
sources:
  - title: Run Claude Code programmatically — Anthropic (Claude Code docs)
    url: https://code.claude.com/docs/en/headless
    verified_on: "2026-09-17"
