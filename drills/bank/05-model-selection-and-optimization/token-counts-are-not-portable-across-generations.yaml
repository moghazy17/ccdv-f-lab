id: token-counts-are-not-portable-across-generations
domain: Model Selection and Optimization
sub_skill: LLM Fundamentals
difficulty: analysis
select: 1
stem: >-
  A team sizes their document chunks against a spreadsheet built two model generations ago, which
  records how many words fit in a context window. Moving to a current model, they find the same word
  counts no longer map to the same token counts, and chunks they believed were safe arrive larger
  than expected. What is the underlying reason?
options:
  - id: a
    text: >-
      Word counts are inherently unrelated to token counts, so no estimate of this kind can ever be
      used.
    correct: false
    rationale: >-
      An approximate ratio is useful and is published for exactly this purpose. The lesson is that it
      is tied to a tokenizer, not that estimation is impossible.
    trap_type: overkill
  - id: b
    text: >-
      Context windows shrank between generations, so the same tokens no longer fit.
    correct: false
    rationale: >-
      The window did not shrink; what changed is how many tokens a given passage becomes. Blaming
      capacity would send the team looking for a model with a larger window they do not need.
    trap_type: false-capability
  - id: c
    text: >-
      The tokenizer changed between generations, so the same text yields a different token count.
    correct: true
    rationale: >-
      A words-to-tokens ratio is specific to the tokenizer it was measured on. A 1M window is roughly
      555k words on the current tokenizer, where earlier models fit about 750k words in the same
      budget, so a ratio recorded against the old one understates token counts on the new one —
      exactly the direction of the team's surprise.
  - id: d
    text: >-
      Token counts vary by request because thinking tokens are counted against the input budget,
      making any fixed estimate unreliable.
    correct: false
    rationale: >-
      Thinking is generated, not part of the input the team is chunking, and it is bounded by the
      response limit rather than the input. This substitutes a real mechanism for the one in play.
    trap_type: right-idea-wrong-mechanism
  - id: e
    text: >-
      The chunks now include cached content, which is counted twice — once as a cache read and again
      as input.
    correct: false
    rationale: >-
      Total input is the sum of distinct components rather than a double count of the same tokens.
      Nothing about caching inflates the measured size of a chunk.
    trap_type: false-capability
sources:
  - title: Models overview — Anthropic
    url: https://platform.claude.com/docs/en/about-claude/models/overview
    verified_on: "2026-09-17"
