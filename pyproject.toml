[project]
name = "ccdv_f_lab"
version = "0.1.0"
description = "Keyless teaching labs for the CCDV-F community study kit."
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "jsonschema>=4.23,<5",
    "mcp>=1.0,<2",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["drills*", "lab*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
